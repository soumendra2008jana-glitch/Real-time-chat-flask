<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flask Realtime Chat</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Socket.IO Client Library (Cloudflare CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.25s ease-out forwards',
            'pulse-subtle': 'pulseSubtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(8px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            pulseSubtle: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.4' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom scrollbar styling */
    #chat-box::-webkit-scrollbar {
      width: 6px;
    }
    #chat-box::-webkit-scrollbar-track {
      background: transparent;
    }
    #chat-box::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    #chat-box::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-6 font-sans relative">

  <!-- Name Input Modal (Blocks chat access until a name is submitted) -->
  <div id="username-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4 transition-all duration-300">
    <div class="w-full max-w-md bg-slate-850/95 bg-slate-900 border border-slate-700/80 rounded-3xl p-6 sm:p-8 shadow-2xl shadow-indigo-950/60 transform transition-all">
      <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center shadow-lg shadow-indigo-500/30 text-white">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
      </div>

      <div class="text-center mb-6">
        <h2 class="text-xl sm:text-2xl font-bold text-white tracking-tight">Join the Conversation</h2>
        <p class="text-sm text-slate-400 mt-1.5">Please choose your display name to start chatting.</p>
      </div>

      <form id="username-form" onsubmit="event.preventDefault(); submitUsername();" class="space-y-4">
        <div>
          <label for="username-input" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5 ml-1">Your Name</label>
          <input 
            type="text" 
            id="username-input" 
            placeholder="e.g. Alex Rivera" 
            maxlength="25"
            autocomplete="off" 
            required 
            class="w-full bg-slate-800/90 text-slate-100 placeholder-slate-500 rounded-2xl px-4 py-3.5 border border-slate-600 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 focus:outline-none transition-all shadow-inner text-sm sm:text-base"
          />
          <p id="modal-error" class="hidden text-rose-400 text-xs mt-1.5 ml-1 font-medium"></p>
        </div>

        <button 
          type="submit" 
          class="w-full py-3.5 px-5 bg-gradient-to-r from-brand-600 to-indigo-500 hover:from-brand-500 hover:to-indigo-400 active:scale-[0.99] text-white font-semibold rounded-2xl transition-all shadow-lg shadow-indigo-600/30 text-sm sm:text-base flex items-center justify-center gap-2"
        >
          <span>Enter Chat</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <div class="w-full max-w-2xl h-[92vh] max-h-[850px] bg-slate-800/90 backdrop-blur-xl border border-slate-700/70 rounded-3xl shadow-2xl flex flex-col overflow-hidden">
    
    <!-- Top Header -->
    <header class="px-5 py-4 bg-slate-900/80 border-b border-slate-700/60 flex items-center justify-between z-10 shrink-0">
      <div class="flex items-center space-x-3">
        <div class="relative">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center shadow-lg shadow-indigo-500/20 font-bold text-white text-base">
            #
          </div>
          <!-- Live pulse dot -->
          <span id="status-dot" class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-amber-400 border-2 border-slate-900 rounded-full animate-pulse"></span>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="font-bold text-base text-slate-100 tracking-tight" id="room-display">general</h1>
            <span class="text-xs px-2 py-0.5 rounded-full bg-slate-700/70 text-slate-300 font-medium">Room</span>
          </div>
          <p id="connection-status" class="text-xs text-slate-400 flex items-center gap-1.5 mt-0.5">
            Connecting...
          </p>
        </div>
      </div>

      <!-- User Profile Badge & Room Selector -->
      <div class="flex items-center gap-2">
        <div class="hidden sm:flex flex-col text-right">
          <span class="text-xs font-semibold text-slate-200" id="user-display-name">Not Joined</span>
          <span id="user-status-pill" class="text-[10px] text-amber-400 font-medium">Pending Name</span>
        </div>
        <button onclick="changeUsernamePrompt()" title="Change Username" class="p-2 rounded-xl bg-slate-700/50 hover:bg-slate-700 text-slate-300 hover:text-white transition-all text-xs flex items-center gap-1.5 border border-slate-600/50">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <span class="hidden sm:inline">Change</span>
        </button>
      </div>
    </header>

    <div id="chat-box" class="flex-1 overflow-y-auto px-4 sm:px-6 py-5 space-y-4">
      <!-- Welcome message -->
      <div class="flex justify-center my-2">
        <span class="px-3.5 py-1 text-[11px] font-medium tracking-wide uppercase bg-slate-700/40 text-slate-400 rounded-full border border-slate-700/50 backdrop-blur-sm shadow-sm">
          Welcome to real-time chat
        </span>
      </div>
    </div>

    <footer class="p-3 sm:p-4 bg-slate-900/90 border-t border-slate-700/60 shrink-0">
      <form id="chat-form" onsubmit="event.preventDefault(); sendMessage();" class="flex items-center gap-2">
        <div class="relative flex-1">
          <input 
            type="text" 
            id="msg-input" 
            placeholder="Type a message... (Press Enter to send)" 
            autocomplete="off"
            class="w-full bg-slate-800/90 text-slate-100 placeholder-slate-400 text-sm sm:text-base rounded-2xl px-4 py-3 sm:py-3.5 pr-11 border border-slate-600/60 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 focus:outline-none transition-all shadow-inner"
          />
        </div>
        <button 
          type="submit" 
          id="send-btn"
          class="h-11 sm:h-12 px-4 sm:px-5 bg-gradient-to-r from-brand-600 to-indigo-500 hover:from-brand-500 hover:to-indigo-400 active:scale-95 text-white font-medium rounded-2xl flex items-center justify-center gap-2 transition-all shadow-lg shadow-indigo-600/30 shrink-0"
        >
          <span class="hidden sm:inline text-sm font-semibold">Send</span>
          <svg class="w-4 h-4 transform rotate-45 -mt-0.5" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/>
          </svg>
        </button>
      </form>
    </footer>

  </div>

  <script>
    // Username is initially null; no random name will be set.
    let username = null;
    const room = "general";
    let socket = null;

    const modal = document.getElementById("username-modal");
    const usernameInput = document.getElementById("username-input");
    const modalError = document.getElementById("modal-error");
    const userDisplay = document.getElementById("user-display-name");
    const userStatusPill = document.getElementById("user-status-pill");
    const chatBox = document.getElementById("chat-box");
    const msgInput = document.getElementById("msg-input");
    const connStatus = document.getElementById("connection-status");
    const statusDot = document.getElementById("status-dot");

    // Modal submit handler
    function submitUsername() {
      const inputVal = usernameInput.value.trim();
      if (!inputVal) {
        showModalError("Please provide a valid display name.");
        return;
      }
      if (inputVal.length > 25) {
        showModalError("Name must be 25 characters or fewer.");
        return;
      }

      username = inputVal;
      if (userDisplay) userDisplay.textContent = username;
      if (userStatusPill) {
        userStatusPill.textContent = "Online";
        userStatusPill.className = "text-[10px] text-emerald-400 font-medium";
      }

      // Hide modal
      modal.classList.add("opacity-0", "pointer-events-none");
      setTimeout(() => {
        modal.style.display = "none";
      }, 300);

      // Start socket connection once name is verified
      initSocketConnection();
      msgInput.focus();
    }

    function showModalError(msg) {
      modalError.textContent = msg;
      modalError.classList.remove("hidden");
      usernameInput.focus();
    }

    // Color generator based on name for receiver avatars
    function stringToColor(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }
      const hue = Math.abs(hash % 360);
      return `hsl(${hue}, 65%, 45%)`;
    }

    // Format current time as HH:MM AM/PM
    function getCurrentTime() {
      const now = new Date();
      return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // Smooth autoscroll to bottom
    function scrollToBottom() {
      chatBox.scrollTo({
        top: chatBox.scrollHeight,
        behavior: 'smooth'
      });
    }

    function appendMessage(sender, messageText, time = getCurrentTime()) {
      const isSystem = sender.toLowerCase() === "system";
      const isMe = sender === username;

      const messageRow = document.createElement("div");
      messageRow.className = "w-full animate-fade-in-up flex";

      if (isSystem) {
        // SYSTEM MESSAGE: Centered pill badge
        messageRow.classList.add("justify-center", "my-2");
        messageRow.innerHTML = `
          <div class="px-3.5 py-1.5 rounded-full bg-slate-700/50 border border-slate-600/40 text-slate-300 text-xs flex items-center gap-1.5 shadow-sm">
            <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>${escapeHtml(messageText)}</span>
          </div>
        `;
      } else if (isMe) {
        // SENDER MESSAGE (Me): Right-aligned with vibrant gradient & clean tail
        messageRow.classList.add("justify-end");
        messageRow.innerHTML = `
          <div class="flex flex-col items-end max-w-[82%] sm:max-w-[70%]">
            <div class="bg-gradient-to-tr from-brand-600 to-indigo-500 text-white rounded-3xl rounded-tr-sm px-4 py-2.5 shadow-md shadow-indigo-950/40 break-words leading-relaxed">
              <p class="text-sm sm:text-base">${escapeHtml(messageText)}</p>
            </div>
            <div class="flex items-center gap-1 mt-1 pr-1 text-[11px] text-slate-400">
              <span>${time}</span>
              <svg class="w-3 h-3 text-emerald-400" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
              </svg>
            </div>
          </div>
        `;
      } else {
        // RECEIVER MESSAGE (Other User): Left-aligned with avatar & user name
        messageRow.classList.add("justify-start");
        const initial = sender.trim().charAt(0).toUpperCase() || "?";
        const avatarBg = stringToColor(sender);

        messageRow.innerHTML = `
          <div class="flex items-end gap-2 max-w-[82%] sm:max-w-[70%]">
            <!-- User Avatar -->
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white shrink-0 shadow-sm" style="background-color: ${avatarBg};">
              ${initial}
            </div>
            <div class="flex flex-col items-start">
              <span class="text-[11px] font-semibold text-slate-400 ml-2 mb-1">${escapeHtml(sender)}</span>
              <div class="bg-slate-700/80 border border-slate-600/50 text-slate-100 rounded-3xl rounded-tl-sm px-4 py-2.5 shadow-md shadow-slate-950/20 break-words leading-relaxed">
                <p class="text-sm sm:text-base">${escapeHtml(messageText)}</p>
              </div>
              <span class="text-[11px] text-slate-400 mt-1 ml-2">${time}</span>
            </div>
          </div>
        `;
      }

      chatBox.appendChild(messageRow);
      scrollToBottom();
    }

    // Basic HTML escaping helper to prevent XSS
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML;
    }

    function initSocketConnection() {
      try {
        socket = io();

        socket.on("connect", () => {
          connStatus.innerHTML = '<span class="text-emerald-400">Connected</span>';
          statusDot.className = "absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-emerald-500 border-2 border-slate-900 rounded-full";
          // Join the room with chosen username
          socket.emit("join", { username: username, room: room });
        });

        socket.on("disconnect", () => {
          connStatus.innerHTML = '<span class="text-rose-400">Disconnected</span>';
          statusDot.className = "absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-rose-500 border-2 border-slate-900 rounded-full";
        });

        socket.on("connect_error", () => {
          connStatus.innerHTML = '<span class="text-amber-400">Standalone Mode</span>';
          statusDot.className = "absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-amber-400 border-2 border-slate-900 rounded-full";
        });

        // Handle incoming messages from Flask-SocketIO backend
        socket.on("message", (data) => {
          appendMessage(data.user, data.msg);
        });

      } catch (e) {
        console.warn("Socket.io not reachable, running in UI preview mode.", e);
        connStatus.innerHTML = '<span class="text-slate-400">Preview Mode</span>';
      }
    }

    // Send message trigger
    function sendMessage() {
      if (!username) {
        modal.style.display = "flex";
        modal.classList.remove("opacity-0", "pointer-events-none");
        usernameInput.focus();
        return;
      }

      const msg = msgInput.value.trim();
      if (!msg) return;

      if (socket && socket.connected) {
        // Real Flask-SocketIO emit
        socket.emit("send_message", { username: username, room: room, msg: msg });
      } else {
        // Standalone preview fallback for browser preview
        appendMessage(username, msg);
        setTimeout(() => {
          appendMessage("Alice", "Welcome to the channel, " + username + "!");
        }, 1100);
      }

      msgInput.value = "";
      msgInput.focus();
    }

    // Change username prompt
    function changeUsernamePrompt() {
      const newName = prompt("Enter your new nickname:", username || "");
      if (newName && newName.trim() !== "" && newName.trim() !== username) {
        const oldName = username;
        username = newName.trim();
        if (userDisplay) userDisplay.textContent = username;

        if (socket && socket.connected) {
          socket.emit("leave", { username: oldName, room: room });
          socket.emit("join", { username: username, room: room });
        } else {
          appendMessage("System", `${oldName} changed name to ${username}`);
        }
      }
    }

    // Send on Enter
    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Auto-focus username input on load
    window.addEventListener("DOMContentLoaded", () => {
      usernameInput.focus();
    });
  </script>
</body>
</html>
